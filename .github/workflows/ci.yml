name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter. With one, CI only ran for PRs targeting `main`, so
  # every PR in a stack — which targets the branch below it, not `main` — got
  # no checks at all and showed up for review with no verification signal.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is here because its compiler dedents docstrings (gh-81283) while
        # 3.11/3.12 don't. Tool descriptions come from docstrings, so leaving
        # 3.13 untested let an interpreter-dependent `schemas/` export reach
        # main and fail CI on 3.12 only. Test what people develop on.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # pyright is what catches `ksapi` API drift: the SDK is async-first, so a
      # tool that forgets to `await` type-checks as a coroutine return. The unit
      # tests pass in that state, which is how it slipped through once already.
      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest tests/ -v

      # Redundant with the test above, but it names the fix in the job log
      # rather than inside a pytest assertion diff.
      - name: Check published schemas are up to date
        run: |
          uv run python scripts/export_schemas.py
          if ! git diff --quiet -- schemas/; then
            echo "::error::schemas/ is out of date. Run 'uv run python scripts/export_schemas.py' and commit the result."
            git --no-pager diff -- schemas/
            exit 1
          fi

      # server.json is what `mcp-publisher` reads at release time, so a stale
      # version here publishes the wrong thing to the MCP registry. Same
      # reasoning as above: name the fix in the log.
      - name: Check version is in sync across all files
        run: uv run python scripts/sync_version.py --check
