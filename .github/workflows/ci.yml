name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # pyright is what catches `ksapi` API drift: the SDK is async-first, so a
      # tool that forgets to `await` type-checks as a coroutine return. The unit
      # tests pass in that state, which is how it slipped through once already.
      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest tests/ -v
