[project]
name = "knowledgestack-mcp"
version = "0.1.0"
description = "MCP server exposing Knowledge Stack tools to any agent framework."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Knowledge Stack" }]
keywords = ["mcp", "knowledge-stack", "agents", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer and dropped `mcp.server.fastmcp`,
    # so the upper bound is load-bearing, not caution. See tests/test_packaging.py.
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "ksapi>=3.26.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
# Named after the distribution so `uvx knowledgestack-mcp` works; `uvx` resolves
# the executable by package name and errors out if only `ks-mcp` exists.
knowledgestack-mcp = "ks_mcp.server:main"
ks-mcp = "ks_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ks_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
